<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="bgb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1512"/><stop offset="1" stop-color="#060b09"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bgb)" rx="10"/>
  <text x="40" y="52" fill="#8fe3c0" font-family="Consolas,monospace" font-size="13" letter-spacing="3">RELIABILITY-BENCH · 寿命分布示意</text>
  <!-- axes -->
  <g stroke="#3a5348" stroke-width="1">
    <path d="M70 340 H740"/><path d="M70 340 V100"/>
  </g>
  <text x="730" y="362" fill="#5d7a6d" font-family="Consolas,monospace" font-size="11" text-anchor="end">lifetime →</text>
  <text x="62" y="96" fill="#5d7a6d" font-family="Consolas,monospace" font-size="11" text-anchor="end">f(t)</text>
  <!-- weibull-like distribution curve -->
  <path d="M70 340 C160 336 210 300 260 220 C300 155 340 140 380 160 C430 185 480 250 540 295 C610 330 690 338 740 340"
        fill="none" stroke="#39e6a3" stroke-width="2.4"/>
  <path d="M70 340 C160 336 210 300 260 220 C300 155 340 140 380 160 C430 185 480 250 540 295 C610 330 690 338 740 340 L740 340 L70 340 Z"
        fill="rgba(57,230,163,0.08)"/>
  <!-- sample points -->
  <g fill="#f2c96b">
    <circle cx="250" cy="238" r="4"/><circle cx="300" cy="176" r="4"/><circle cx="350" cy="150" r="4"/>
    <circle cx="402" cy="165" r="4"/><circle cx="455" cy="205" r="4"/><circle cx="510" cy="258" r="4"/>
    <circle cx="565" cy="300" r="4"/><circle cx="620" cy="322" r="4"/>
  </g>
  <!-- annotations -->
  <g font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#c8ded3">
    <text x="90" y="130">统计样本下的寿命分布</text>
    <text x="90" y="152" fill="#7fa896" font-size="12">每条应力条件 → 一批器件 → 一个分布</text>
    <text x="470" y="120" fill="#f2c96b">客观评分：预测 vs 参考解的数值误差</text>
  </g>
  <line x1="455" y1="140" x2="455" y2="200" stroke="#f2c96b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="40" y="398" fill="#42604f" font-family="'Microsoft YaHei',sans-serif" font-size="12">分钟级一轮实验 · 零授权成本 · 结果可复现</text>
</svg>
