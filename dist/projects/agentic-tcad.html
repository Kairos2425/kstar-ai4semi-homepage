      <section class="detail-notes">
        <h2>方向与价值</h2>
        <p>AI 设计芯片的速度正在以周计，但「这颗芯片能不能用十年」仍然要回到器件物理。这个工作台要做的是把 TCAD 仿真从专家手艺变成可调用的基础设施——AI 负责调度与编排，物理计算交给专业求解器，结论永远带证据链。</p>
        <p>设计原则：仿真结果不冒充实测校准；AI 只理解意图与组织流程，数值结论全部来自确定性计算。</p>
