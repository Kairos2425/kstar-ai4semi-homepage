<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Layout Canvas | AI4Semi 项目介绍</title>
    <link rel="stylesheet" href="../styles.css?v=20260915a" />
  </head>
  <body>
    <main class="detail-page">
      <a class="back-link" href="../index.html#projects">返回主页</a>
      <header class="detail-hero">
        <p class="eyebrow">Layout Compiler</p>
        <h1>Agent 原生的版图编译工作台</h1>
        <p>Agent 说「给我一个 5 管 OTA，面积 &lt; 4000µm²」，系统迭代产出 DRC/LVS 干净、PPA 达标的 GDS。事务化编辑引擎 + 显式连接性 + fail-closed 验证。</p>
      </header>
      <figure class="fx-hero">
        <div class="fx-stage" data-fx="layout"></div>
        <figcaption>compile → place → route：单元落位与布线的编译过程动画</figcaption>
      </figure>
      <section class="detail-grid">
        <figure class="detail-shot detail-shot--wide detail-shot--screen">
          <img src="../assets/showcase/layout-canvas-cover.svg" alt="Layout Canvas 版图编译示意" />
          <figcaption>版图编译示意：标准单元行、布线、引脚与 die 边界——从电路到可制造版图的编译过程。</figcaption>
        </figure>
        <figure class="detail-shot detail-shot--wide detail-shot--screen">
          <img src="../assets/showcase/layout-edit-loop.svg" alt="编辑-验证闭环" />
          <figcaption>编辑-验证闭环：Agent 提需求 → 试编辑（可回滚）→ 验证 → 通过才提交，不达标回滚重试。</figcaption>
        </figure>
      </section>
      <section class="detail-notes">
        <h2>方向与价值</h2>
        <p>版图是模拟芯片自动化最难的一段：AI 生成电路很快，但从电路到可制造版图仍然要靠人。这个工作台探索的是 Agent 真正动手做版图时需要的工程底座——每次修改可回滚、验证不通过绝不报假通过。</p>
        <p>设计原则：电气连接是显式事实而不是视觉巧合；验证工具不可用时明确报告受阻，绝不输出虚假的「已通过」。</p>
      </section>
    </main>
    <script src="../motion.js?v=20260915a"></script>
      <script src="../fx.js?v=20260915a"></script>
  </body>
</html>
