        <h1>HCI 可靠性数据处理工具</h1>
        <p>面向 HCI 应力测试数据的一体化处理桌面端：从测试机台原始文件到退化绘图、寿命外推、认证决策与 Excel/PPT 报告，全程可追溯。</p>

      <figure class="fx-hero">

      </figure>

      <section class="detail-grid">
        <figure class="detail-shot detail-shot--wide detail-shot--pad">
          <h3 style="margin:0 0 10px">它解决什么问题</h3>
          <p style="color:var(--muted);line-height:1.8;margin:0">
            HCI 测试机台导出的原始文件格式杂、命名乱、同一批数据被重复导入是常态；Excel 手算退化斜率和寿命外推
            既慢又无法复现。本工具用「原始数据不可变 + 分析层规范化」的双层数据底座，文件指纹自动查重、
            排除/恢复留痕，让每一张退化图都能回溯到具体文件与样本。
          </p>
        </figure>
        <figure class="detail-shot detail-shot--pad">
          <h3 style="margin:0 0 10px">数据接入与治理</h3>
          <p style="color:var(--muted);line-height:1.8;margin:0">
            兼容主流测试机台导出格式，原始文件无损解析入库；
            文件指纹自动查重 + 导入两步确认；原始数据不可变，分析侧只做排除/恢复并保留审计链；
            自动推测的时间轴必须由工程师确认，预设值绝不升格为测量值。
          </p>
        </figure>
        <figure class="detail-shot detail-shot--pad">
          <h3 style="margin:0 0 10px">分析与交付</h3>
          <p style="color:var(--muted);line-height:1.8;margin:0">
            基线对齐、退化拟合、log 轴可绘制状态检查；寿命外推 → CDF 统计 →
            认证决策（qualification decision）→ Excel / PPT 资格报告一键交付。
            附带离线授权机制，可作为只读 EXE 分发给产线或客户工程师。
          </p>
        </figure>
      </section>
