      <header class="detail-hero">
        <p class="eyebrow">User Guide</p>
        <h1>PPT 模板工作台 · 使用指南</h1>
        <p>本地大模型驱动的 PPT 排版工作台：套用你自己的模板，AI 起草大纲与润色，版式引擎产出原生可编辑的 PPTX。全程离线，数据不出本机。</p>
      </header>

      <section class="detail-grid">
        <figure class="detail-shot detail-shot--pad">
          <h3 style="margin:0 0 10px">它能做什么</h3>
          <ul style="color:var(--muted);line-height:1.9;margin:0;padding-left:1.2em">
            <li><strong>模板驱动排版</strong>：上传你的 .pptx 模板，版式引擎按模板真实排版，不是贴图。</li>
            <li><strong>AI 大纲与润色</strong>：按 [data] / [process] / [compare] / [timeline] 等页面类型组织内容，本地模型起草、润色、扩写。</li>
            <li><strong>原生可编辑输出</strong>：生成文本框、形状、图表、表格等 PPT 原生对象，导出后可以继续改。</li>
            <li><strong>质量审计</strong>：自动检查文本越界、密度过高、图片过小等常见排版问题。</li>
            <li><strong>文献速读与脑图</strong>：批量上传论文，逐篇结构化精读 + 跨文献综合评述 + 可拖拽脑图，扫描版 PDF 自动 OCR。</li>
            <li><strong>全离线</strong>：模型、解析、渲染全部在本地完成，不上传任何数据。</li>
          </ul>
        </figure>
        <figure class="detail-shot detail-shot--pad">
          <h3 style="margin:0 0 10px">快速上手</h3>
          <ol style="color:var(--muted);line-height:1.9;margin:0;padding-left:1.2em">
            <li>获得授权分发包后解压到本地目录（建议路径不含中文与空格）。</li>
            <li>运行启动程序，等待本地服务与模型初始化完成（首次启动较慢，属正常现象）。</li>
            <li>浏览器界面自动打开；若未打开，按启动窗口提示的地址手动访问。</li>
            <li>在模板库选择或导入模板 → 在大纲编辑器组织页面内容 → 一键生成 PPTX。</li>
            <li>生成结果可在界面上预览首页效果，导出后用 PowerPoint / WPS 继续编辑。</li>
          </ol>
        </figure>
        <figure class="detail-shot detail-shot--pad">
          <h3 style="margin:0 0 10px">文献速读怎么用</h3>
          <p style="color:var(--muted);line-height:1.8;margin:0">
            从工作台入口进入文献速读界面，一次上传 3~5 篇论文 PDF。系统逐篇输出结构化精读
            （器件类型 / 应力条件 / 退化机理 / 定量结论 / 局限与可专利点），再做跨文献综合评述，
            并生成可拖拽的知识脑图。扫描版 PDF 会自动走 OCR 通道，无需手动切换。
          </p>
        </figure>
        <figure class="detail-shot detail-shot--pad">
          <h3 style="margin:0 0 10px">常见问题</h3>
          <ul style="color:var(--muted);line-height:1.9;margin:0;padding-left:1.2em">
            <li><strong>界面打不开</strong>：本地服务端口被占用时会自动顺延，以启动窗口提示的实际地址为准。</li>
            <li><strong>生成很慢</strong>：本地大模型推理吃内存与算力，关闭其他重负载程序会明显加快。</li>
            <li><strong>扫描件识别不完整</strong>：图像型 PDF 只能 OCR 提取文字，无法读取矢量图形中的标注。</li>
            <li><strong>换电脑使用</strong>：整包复制即可，无需安装运行环境；授权信息随包携带。</li>
          </ul>
        </figure>
      </section>
