      <header class="detail-hero">
        <p class="eyebrow">User Guide</p>
        <h1>DCC 报告检查工具 · 使用指南</h1>
        <p>面向半导体认证/可靠性报告的自动化预审工具：规则包驱动，把人工逐条核对变成一键扫描，只输出不通过项及整改建议。</p>
      </header>

      <section class="detail-grid">
        <figure class="detail-shot detail-shot--pad">
          <h3 style="margin:0 0 10px">检查能力</h3>
          <ul style="color:var(--muted);line-height:1.9;margin:0;padding-left:1.2em">
            <li><strong>必备内容</strong>：关键章节、必填字段、必要声明是否齐全。</li>
            <li><strong>术语一致性</strong>：术语字典核对，同一概念前后写法统一。</li>
            <li><strong>禁止内容</strong>：不规范表述、禁用写法自动标出。</li>
            <li><strong>数值与表格比对</strong>：正文与表格数值交叉核对，单位与量纲检查。</li>
            <li><strong>章节结构</strong>：章节层级、编号连续性与完整性检查。</li>
            <li><strong>版式规范</strong>：页面布局类要求检查。</li>
            <li><strong>错别字与拼写</strong>：常见错别字、中英文混排问题。</li>
            <li><strong>图像辅助检查</strong>：内嵌曲线图、扫描表格等图像内容的辅助识别。</li>
          </ul>
        </figure>
        <figure class="detail-shot detail-shot--pad">
          <h3 style="margin:0 0 10px">使用流程</h3>
          <ol style="color:var(--muted);line-height:1.9;margin:0;padding-left:1.2em">
            <li>运行程序，在界面中选择待检查的 Word 报告文件。</li>
            <li>确认规则包已加载（首次使用按界面提示选择随包提供的规则文件，之后自动记忆）。</li>
            <li>点击开始检查，进度与日志实时显示。</li>
            <li>检查完成后生成 Excel 结果报告：只列出不通过项，每条带定位信息与整改建议。</li>
            <li>按报告逐项修订文档后重新检查，直至清零。</li>
          </ol>
        </figure>
        <figure class="detail-shot detail-shot--pad">
          <h3 style="margin:0 0 10px">结果报告怎么读</h3>
          <p style="color:var(--muted);line-height:1.8;margin:0">
            结果按「只列 FAIL」原则输出：通过项不占用版面。每条记录包含所在章节/页码定位、
            命中的规则类别、实际内容描述与整改建议，可直接作为修订工作清单分派。
            Warning 级条目表示需要人工复核的边界情况，不直接判失败。
          </p>
        </figure>
        <figure class="detail-shot detail-shot--pad">
          <h3 style="margin:0 0 10px">常见问题</h3>
          <ul style="color:var(--muted);line-height:1.9;margin:0;padding-left:1.2em">
            <li><strong>规则包路径为空</strong>：首次运行需手动选择一次规则文件，之后自动记忆。</li>
            <li><strong>全是 Warning 没有 Error</strong>：属正常，Warning 是建议复核项，不判失败。</li>
            <li><strong>图像类检查未生效</strong>：仅当报告中包含扫描件/图片时才触发，纯文本报告自动跳过。</li>
            <li><strong>换电脑使用</strong>：整目录复制即可，无需安装额外运行环境。</li>
            <li><strong>规则需要调整</strong>：规则以表格形式维护，新增/修改条目后重启检查即生效——具体维护方式见随包手册。</li>
          </ul>
        </figure>
      </section>
